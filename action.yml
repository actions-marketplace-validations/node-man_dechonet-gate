name: DechoNet deploy gate
description: Fail the job when the deployed site misses your HTTPS, certificate or security-header bar, or a workflow has a supply-chain hole (DechoNet).
author: DechoNet
branding:
  icon: shield
  color: gray
inputs:
  url:
    description: Deployed URL to check, e.g. https://example.com/ (leave empty to run only the workflow check)
    default: ''
  min-ssl-grade:
    description: Lowest acceptable SSL grade (A+, A, B, C, D, E, F)
    default: B
  min-header-grade:
    description: Lowest acceptable security-header grade (A+ … F)
    default: C
  min-cert-days:
    description: Fail when the certificate expires in fewer days
    default: '14'
  require-https:
    description: Fail when the final page is served over plain HTTP ('true' or 'false')
    default: 'true'
  api-key:
    description: Optional DechoNet API key (own rate limits). Store it as a secret.
    default: ''
  fail-on-unknown:
    description: Also fail when a check could not be verified ('true' or 'false')
    default: 'false'
  endpoint:
    description: API base URL
    default: https://dechonet.com
  check-workflows:
    description: Also check this repository's workflow files for supply-chain holes, on the runner — nothing is sent ('true' or 'false')
    default: 'false'
  workflows-fail-on:
    description: Lowest workflow finding that fails the job (high, medium, info, none)
    default: high
  workflows-dir:
    description: Directory with the workflow files
    default: .github/workflows
outputs:
  pass:
    description: "'true' when every site check passed"
    value: ${{ steps.gate.outputs.pass }}
  workflows-pass:
    description: "'true' when the workflow check found nothing at or above workflows-fail-on"
    value: ${{ steps.workflows.outputs.workflows-pass }}
runs:
  using: composite
  steps:
    - id: gate
      if: inputs.url != ''
      shell: bash
      env:
        DN_URL: ${{ inputs.url }}
        DN_MIN_SSL: ${{ inputs.min-ssl-grade }}
        DN_MIN_HEADERS: ${{ inputs.min-header-grade }}
        DN_MIN_DAYS: ${{ inputs.min-cert-days }}
        DN_HTTPS: ${{ inputs.require-https }}
        DN_KEY: ${{ inputs.api-key }}
        DN_UNKNOWN: ${{ inputs.fail-on-unknown }}
        DN_ENDPOINT: ${{ inputs.endpoint }}
      run: bash "${{ github.action_path }}/gate.sh"
    - id: workflows
      # Runs after the site check even when that failed, so one run reports both.
      if: ${{ !cancelled() && inputs.check-workflows == 'true' }}
      shell: bash
      env:
        DN_WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
        DN_WORKFLOWS_FAIL_ON: ${{ inputs.workflows-fail-on }}
      run: node "${{ github.action_path }}/workflows.mjs"
